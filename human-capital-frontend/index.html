<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Ducky Human Capital — Admin Portal</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --bg: #0d1117;
      --surface: #161b22;
      --surface2: #21262d;
      --border: #30363d;
      --accent: #58a6ff;
      --accent2: #f78166;
      --green: #3fb950;
      --red: #f85149;
      --yellow: #d29922;
      --orange: #f0883e;
      --text: #c9d1d9;
      --muted: #8b949e;
      --radius: 10px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

    header {
      background: linear-gradient(135deg, #0f3460 0%, #16213e 60%, #1a1a2e 100%);
      padding: 18px 32px; display: flex; align-items: center; gap: 16px;
      border-bottom: 1px solid var(--border);
      box-shadow: 0 2px 16px rgba(88,166,255,.12);
    }
    header .logo { font-size: 28px; }
    header h1 { font-size: 1.3rem; font-weight: 700; color: var(--accent); }
    header p  { font-size: .78rem; color: var(--muted); margin-top: 2px; }

    .layout { display: flex; height: calc(100vh - 72px); }
    nav {
      width: 230px; background: var(--surface); border-right: 1px solid var(--border);
      padding: 20px 0; display: flex; flex-direction: column; gap: 2px; flex-shrink: 0;
    }
    nav button {
      background: none; border: none; color: var(--muted); text-align: left;
      padding: 9px 18px; font-size: .87rem; font-weight: 500; cursor: pointer;
      border-left: 3px solid transparent; transition: all .18s; font-family: 'Inter', sans-serif;
      display: flex; align-items: center; gap: 8px;
    }
    nav button:hover { color: var(--text); background: var(--surface2); }
    nav button.active { color: var(--accent); border-left-color: var(--accent); background: rgba(88,166,255,.07); }
    nav .section-label { color: var(--muted); font-size: .69rem; font-weight: 600; padding: 14px 18px 4px; letter-spacing: .1em; text-transform: uppercase; }

    main { flex: 1; overflow-y: auto; padding: 28px 32px; }

    .panel-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 22px; }
    .panel-header h2 { font-size: 1.15rem; font-weight: 600; color: var(--text); }
    .panel-header .meta { color: var(--muted); font-size: .8rem; margin-top: 2px; }

    .btn { padding: 8px 16px; border-radius: 6px; font-size: .83rem; font-weight: 600; cursor: pointer; border: none; font-family: 'Inter', sans-serif; transition: all .15s; }
    .btn-primary { background: var(--accent); color: #000; }
    .btn-primary:hover { background: #79c0ff; }
    .btn-danger  { background: rgba(248,81,73,.12); color: var(--red); border: 1px solid rgba(248,81,73,.3); }
    .btn-danger:hover { background: rgba(248,81,73,.22); }
    .btn-edit    { background: rgba(88,166,255,.1); color: var(--accent); border: 1px solid rgba(88,166,255,.2); }
    .btn-edit:hover { background: rgba(88,166,255,.2); }
    .btn-sm { padding: 5px 10px; font-size: .76rem; }

    .table-wrap { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
    table { width: 100%; border-collapse: collapse; font-size: .83rem; }
    thead th { background: var(--surface2); color: var(--muted); font-weight: 600; font-size: .73rem; text-transform: uppercase; letter-spacing: .06em; padding: 11px 14px; text-align: left; border-bottom: 1px solid var(--border); }
    tbody tr { border-bottom: 1px solid rgba(48,54,61,.8); transition: background .15s; }
    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: rgba(88,166,255,.04); }
    td { padding: 10px 14px; vertical-align: middle; }
    .actions { display: flex; gap: 6px; }

    .badge { display: inline-block; padding: 3px 9px; border-radius: 20px; font-size: .71rem; font-weight: 600; }
    .badge-green  { background: rgba(63,185,80,.12);   color: var(--green); }
    .badge-red    { background: rgba(248,81,73,.12);   color: var(--red); }
    .badge-yellow { background: rgba(210,153,34,.15);  color: var(--yellow); }
    .badge-orange { background: rgba(240,136,62,.12);  color: var(--orange); }
    .badge-muted  { background: rgba(139,148,158,.12); color: var(--muted); }

    .pagination { display: flex; align-items: center; gap: 10px; margin-top: 20px; justify-content: flex-end; }
    .pagination button { background: var(--surface); border: 1px solid var(--border); color: var(--text); padding: 7px 14px; border-radius: 6px; cursor: pointer; font-size: .82rem; font-family: 'Inter', sans-serif; transition: all .15s; }
    .pagination button:hover:not(:disabled) { background: var(--surface2); border-color: var(--accent); color: var(--accent); }
    .pagination button:disabled { opacity: .3; cursor: not-allowed; }
    .pagination .page-info { color: var(--muted); font-size: .8rem; }

    .overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.7); backdrop-filter: blur(4px); z-index: 100; align-items: center; justify-content: center; }
    .overlay.open { display: flex; }
    .modal { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 26px; width: 540px; max-width: 95vw; max-height: 90vh; overflow-y: auto; box-shadow: 0 20px 70px rgba(0,0,0,.6); }
    .modal h3 { font-size: 1rem; font-weight: 700; margin-bottom: 18px; color: var(--accent); }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 13px; }
    .form-grid .full { grid-column: 1 / -1; }
    label { font-size: .76rem; color: var(--muted); font-weight: 500; display: block; margin-bottom: 4px; letter-spacing: .02em; }
    input, select, textarea {
      width: 100%; background: var(--surface2); border: 1px solid var(--border); color: var(--text);
      padding: 8px 11px; border-radius: 6px; font-size: .84rem; font-family: 'Inter', sans-serif; outline: none; transition: border .2s;
    }
    input:focus, select:focus, textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(88,166,255,.1); }
    textarea { resize: vertical; min-height: 60px; }
    .modal-footer { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; border-top: 1px solid var(--border); padding-top: 16px; }

    .state-box { text-align: center; padding: 60px 20px; color: var(--muted); }
    .state-box .icon { font-size: 2.5rem; margin-bottom: 10px; }
    .state-box p { font-size: .9rem; }

    #toast { position: fixed; bottom: 24px; right: 24px; background: var(--surface2); border: 1px solid var(--border); padding: 11px 18px; border-radius: 8px; font-size: .84rem; z-index: 999; opacity: 0; transform: translateY(8px); transition: all .3s; pointer-events: none; }
    #toast.show { opacity: 1; transform: translateY(0); }
    #toast.success { border-color: var(--green); color: var(--green); }
    #toast.error   { border-color: var(--red);   color: var(--red); }

    .salary { font-family: monospace; color: var(--green); font-size: .83rem; }
  </style>
</head>
<body>

<header>
  <div class="logo">🏢</div>
  <div>
    <h1>Ducky Human Capital — Admin Portal</h1>
    <p>Manage HR records · No authentication required</p>
  </div>
</header>

<div class="layout">
  <nav id="nav">
    <div class="section-label">Personnel</div>
    <button onclick="switchTable('employees')" class="active">👤 Employees</button>
    <button onclick="switchTable('collaborators')">🤝 Collaborators</button>
    <button onclick="switchTable('professors')">🎓 Professors</button>
    <div class="section-label">Organization</div>
    <button onclick="switchTable('departments')">🏗️ Departments</button>
    <button onclick="switchTable('office-locations')">📍 Office Locations</button>
  </nav>

  <main>
    <div class="panel-header">
      <div>
        <h2 id="panel-title">Employees</h2>
        <div class="meta" id="panel-meta">Loading…</div>
      </div>
      <button class="btn btn-primary" onclick="openAdd()">＋ Add Record</button>
    </div>

    <div class="table-wrap">
      <table>
        <thead id="thead"><tr></tr></thead>
        <tbody id="tbody"><tr><td colspan="10"><div class="state-box"><div class="icon">⏳</div><p>Loading…</p></div></td></tr></tbody>
      </table>
    </div>

    <div class="pagination">
      <button id="btn-prev" onclick="changePage(-1)" disabled>← Prev</button>
      <span class="page-info" id="page-info">Page 1</span>
      <button id="btn-next" onclick="changePage(1)">Next →</button>
    </div>
  </main>
</div>

<div class="overlay" id="overlay">
  <div class="modal">
    <h3 id="modal-title">Add Record</h3>
    <form id="modal-form" class="form-grid" onsubmit="submitForm(event)"></form>
    <div class="modal-footer">
      <button class="btn" style="background:var(--surface2);border:1px solid var(--border)" onclick="closeModal()" type="button">Cancel</button>
      <button class="btn btn-primary" type="submit" form="modal-form">Save Record</button>
    </div>
  </div>
</div>
<div id="toast"></div>

<script>
const BFF = 'http://localhost:4002';
let currentTable = 'employees';
let currentPage  = 1;
let totalPages   = 1;
let editingId    = null;

const statusBadge = { active:'green', inactive:'muted', suspended:'yellow', terminated:'red', on_leave:'orange', retired:'muted' };
const collabBadge = { active:'green', inactive:'muted', suspended:'yellow', terminated:'red' };
const profBadge   = { active:'green', inactive:'muted', on_leave:'yellow', retired:'orange' };

const TABLES = {
  'employees': {
    label: 'Employees', endpoint: '/api/employees', idKey: 'employee_id',
    cols: ['employee_id','first_name','father_lastname','employee_email','employee_status','RFC','base_salary','hire_date'],
    headers: ['ID','First Name','Last Name','Email','Status','RFC','Salary','Hire Date'],
    badge: { key:'employee_status', map: statusBadge },
    salaryCols: ['base_salary'],
    fields: [
      { name:'first_name',       label:'First Name',   type:'text',   required:true },
      { name:'middle_name',      label:'Middle Name',  type:'text' },
      { name:'father_lastname',  label:'Last Name',    type:'text',   required:true },
      { name:'mother_lastname',  label:'Mother Name',  type:'text' },
      { name:'employee_email',   label:'Email',        type:'email',  full:true },
      { name:'employee_phone',   label:'Phone',        type:'text' },
      { name:'employee_status',  label:'Status',       type:'select', required:true, options:['active','inactive','suspended','terminated','on_leave'] },
      { name:'RFC',              label:'RFC (12-13 chars)', type:'text', required:true },
      { name:'CLABE',            label:'CLABE (18 chars)',  type:'text', required:true, full:true },
      { name:'hire_date',        label:'Hire Date',    type:'date',   required:true },
      { name:'base_salary',      label:'Base Salary',  type:'number', required:true },
    ],
  },
  'collaborators': {
    label: 'Collaborators', endpoint: '/api/collaborators', idKey: 'collaborator_id',
    cols: ['collaborator_id','employee_name','job_title','supervisor_id','shift_type','collaborator_status'],
    headers: ['Employee ID','Employee','Job Title','Supervisor ID','Shift','Status'],
    badge: { key:'collaborator_status', map: collabBadge },
    fields: [
      { name:'collaborator_id',     label:'Employee ID (FK)',  type:'number', required:true },
      { name:'job_title',           label:'Job Title',         type:'text',   required:true, full:true },
      { name:'supervisor_id',       label:'Supervisor ID (FK)',type:'number', required:true },
      { name:'shift_type',          label:'Shift',             type:'select', required:true, options:['morning','evening','night','mixed'] },
      { name:'collaborator_status', label:'Status',            type:'select', required:true, options:['active','inactive','suspended','terminated'] },
    ],
  },
  'professors': {
    label: 'Professors', endpoint: '/api/professors', idKey: 'professor_id',
    cols: ['professor_id','employee_name','academic_title','department_name','research_area','professor_status'],
    headers: ['Employee ID','Name','Title','Department','Research Area','Status'],
    badge: { key:'professor_status', map: profBadge },
    fields: [
      { name:'professor_id',       label:'Employee ID (FK)',   type:'number', required:true },
      { name:'department_id',      label:'Department ID (FK)', type:'number', required:true },
      { name:'academic_title',     label:'Academic Title',     type:'text',   required:true },
      { name:'research_area',      label:'Research Area',      type:'text',   full:true },
      { name:'hire_date',          label:'Hire Date',          type:'date',   required:true },
      { name:'office_location_id', label:'Office Location ID', type:'number' },
      { name:'professor_status',   label:'Status',             type:'select', required:true, options:['active','inactive','on_leave','retired'] },
    ],
  },
  'departments': {
    label: 'Departments', endpoint: '/api/departments', idKey: 'departmen_id',
    cols: ['departmen_id','department_name','department_head_id'],
    headers: ['ID','Name','Head Employee ID'],
    badge: null,
    fields: [
      { name:'department_name',    label:'Department Name',     type:'text',   required:true, full:true },
      { name:'department_head_id', label:'Head Employee ID (FK)',type:'number', required:true, full:true },
    ],
  },
  'office-locations': {
    label: 'Office Locations', endpoint: '/api/office-locations', idKey: 'location_id',
    cols: ['location_id','location_building_name','location_floor','location_room_number','location_capacity'],
    headers: ['ID','Building','Floor','Room','Capacity'],
    badge: null,
    fields: [
      { name:'location_building_name', label:'Building', type:'text',   required:true, full:true },
      { name:'location_floor',         label:'Floor',    type:'number', required:true },
      { name:'location_room_number',   label:'Room #',   type:'number', required:true },
      { name:'location_capacity',      label:'Capacity', type:'number', required:true },
    ],
  },
};

// ─── Client-side validation ─────────────────────────────────────────────────────
const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
const PHONE_RE = /^\+?[\d\s\-().]{7,20}$/;

function validateForm(cfg, body) {
  for (const f of cfg.fields) {
    if (f.required && (body[f.name] === null || body[f.name] === undefined || String(body[f.name]).trim() === '')) {
      return `El campo "${f.label}" es obligatorio.`;
    }
  }
  if (cfg.endpoint === '/api/employees') {
    if (body.employee_email && !EMAIL_RE.test(body.employee_email))
      return 'El correo electrónico no tiene un formato válido (ej: nombre@dominio.com).';
    if (body.employee_phone && !PHONE_RE.test(body.employee_phone))
      return 'El teléfono no tiene un formato válido.';
  }
  return null;
}

function switchTable(name) {
  currentTable = name;
  currentPage  = 1;
  editingId    = null;
  document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');
  document.getElementById('panel-title').textContent = TABLES[name].label;
  loadData();
}

async function loadData() {
  const cfg = TABLES[currentTable];
  document.getElementById('panel-meta').textContent = 'Loading…';
  try {
    const r = await fetch(`${BFF}${cfg.endpoint}?page=${currentPage}`);
    const d = await r.json();
    if (d.error) throw new Error(d.error);
    renderTable(cfg, d.items || []);
    totalPages = d.pages || 1;
    document.getElementById('page-info').textContent = `Page ${d.page} of ${d.pages} · ${d.total} records`;
    document.getElementById('panel-meta').textContent = `${d.total} total records`;
    document.getElementById('btn-prev').disabled = currentPage <= 1;
    document.getElementById('btn-next').disabled = currentPage >= totalPages;
  } catch(e) {
    document.getElementById('tbody').innerHTML = `<tr><td colspan="10"><div class="state-box"><div class="icon">⚠️</div><p>${e.message}</p></div></td></tr>`;
    document.getElementById('panel-meta').textContent = 'Failed to load';
  }
}

function renderTable(cfg, items) {
  const ths = cfg.headers.map(h => `<th>${h}</th>`).join('') + '<th>Actions</th>';
  document.getElementById('thead').innerHTML = `<tr>${ths}</tr>`;
  if (!items.length) {
    document.getElementById('tbody').innerHTML = `<tr><td colspan="${cfg.cols.length + 1}"><div class="state-box"><div class="icon">📭</div><p>No records found</p></div></td></tr>`;
    return;
  }
  const rows = items.map(row => {
    const cells = cfg.cols.map(col => {
      let val = row[col];
      if (val === null || val === undefined) return '<td><span style="color:var(--muted)">—</span></td>';
      if (typeof val === 'boolean') val = val ? '✅' : '❌';
      if (typeof val === 'string' && val.match(/^\d{4}-\d{2}-\d{2}T/)) val = val.split('T')[0];
      if (cfg.badge && col === cfg.badge.key) {
        const color = cfg.badge.map[val] || 'muted';
        return `<td><span class="badge badge-${color}">${val}</span></td>`;
      }
      if (cfg.salaryCols && cfg.salaryCols.includes(col)) {
        return `<td><span class="salary">$${Number(val).toLocaleString()}</span></td>`;
      }
      return `<td>${val}</td>`;
    }).join('');
    const id = row[cfg.idKey];
    const actions = `<td><div class="actions">
      <button class="btn btn-edit btn-sm" onclick='openEdit(${JSON.stringify(row)})'>Edit</button>
      <button class="btn btn-danger btn-sm" onclick="deleteRecord('${id}')">Delete</button>
    </div></td>`;
    return `<tr>${cells}${actions}</tr>`;
  }).join('');
  document.getElementById('tbody').innerHTML = rows;
}

function changePage(delta) {
  currentPage = Math.max(1, Math.min(totalPages, currentPage + delta));
  loadData();
}

function buildForm(cfg, data = {}) {
  return cfg.fields.map(f => {
    const val = data[f.name] !== undefined ? data[f.name] : '';
    let input = '';
    if (f.type === 'select') {
      const opts = f.options.map(o => `<option value="${o}" ${val == o ? 'selected' : ''}>${o}</option>`).join('');
      input = `<select name="${f.name}" ${f.required ? 'required' : ''}>${opts}</select>`;
    } else {
      let v = val;
      if (f.type === 'date' && v) v = String(v).split('T')[0];
      input = `<input type="${f.type}" name="${f.name}" value="${v}" ${f.required ? 'required' : ''} />`;
    }
    return `<div class="${f.full ? 'full' : ''}"><label>${f.label}</label>${input}</div>`;
  }).join('');
}

function openAdd() {
  editingId = null;
  const cfg = TABLES[currentTable];
  document.getElementById('modal-title').textContent = `Add ${cfg.label.replace(/s$/,'')}`;
  document.getElementById('modal-form').innerHTML = buildForm(cfg);
  document.getElementById('overlay').classList.add('open');
}

function openEdit(row) {
  const cfg = TABLES[currentTable];
  editingId = row[cfg.idKey];
  document.getElementById('modal-title').textContent = `Edit ${cfg.label.replace(/s$/,'')} #${editingId}`;
  document.getElementById('modal-form').innerHTML = buildForm(cfg, row);
  document.getElementById('overlay').classList.add('open');
}

function closeModal() { document.getElementById('overlay').classList.remove('open'); }

async function submitForm(e) {
  e.preventDefault();
  const cfg = TABLES[currentTable];
  const fd  = new FormData(e.target);
  const body = {};
  fd.forEach((v, k) => { body[k] = v === '' ? null : v; });

  // ── Step 1: Client-side validation ──
  const validationError = validateForm(cfg, body);
  if (validationError) {
    toast('⚠ ' + validationError, 'error');
    return;
  }

  const url    = editingId !== null ? `${BFF}${cfg.endpoint}/${editingId}` : `${BFF}${cfg.endpoint}`;
  const method = editingId !== null ? 'PUT' : 'POST';

  // ── Step 2: Send to BFF ──
  try {
    const r = await fetch(url, { method, headers: {'Content-Type':'application/json'}, body: JSON.stringify(body) });
    const d = await r.json();
    // ── Step 3: Display BFF success message or error ──
    if (!r.ok) throw new Error(d.error || 'Request failed');
    closeModal();
    toast('✓ ' + (d.message || 'Operación completada con éxito.'), 'success');
    loadData();
  } catch(err) { toast('✗ ' + err.message, 'error'); }
}

async function deleteRecord(id) {
  const cfg = TABLES[currentTable];
  const isEmployee = cfg.endpoint === '/api/employees';
  const confirmMsg = isEmployee
    ? '¿Desactivar este empleado? El registro se conserva en la base de datos.'
    : '¿Eliminar este registro? Esta acción no se puede deshacer.';
  if (!confirm(confirmMsg)) return;
  try {
    const r = await fetch(`${BFF}${cfg.endpoint}/${id}`, { method: 'DELETE' });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || 'Delete failed');
    toast('✓ ' + (d.message || (isEmployee ? 'Empleado desactivado.' : 'Registro eliminado.')), 'success');
    loadData();
  } catch(e) { toast('✗ ' + e.message, 'error'); }
}

function toast(msg, type = 'success') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = `show ${type}`;
  setTimeout(() => { t.className = ''; }, 3200);
}

document.getElementById('overlay').addEventListener('click', e => {
  if (e.target === document.getElementById('overlay')) closeModal();
});

loadData();
</script>
</body>
</html>
