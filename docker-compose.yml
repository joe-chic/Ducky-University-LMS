    command: >
      sh -c "until psql -h $$PGHOST -p $$PGPORT -U $$PGUSER -d $$PGDATABASE -c 'select 1' >/dev/null 2>&1; do sleep 1; done;
      sed -e '/^CREATE DATABASE /d' -e '/^\\\\c /d' /seed/schema.sql | psql -h $$PGHOST -p $$PGPORT -U $$PGUSER -d $$PGDATABASE;
      sed -e '/^\\\\c /d' /seed/data.sql | psql -v ON_ERROR_STOP=0 -h $$PGHOST -p $$PGPORT -U $$PGUSER -d $$PGDATABASE"

  human-capital-microservice:
    build: ./human-capital-microservice
    environment:
      PORT: 3005
      PGHOST: db-human-capital
      PGPORT: 5432
      PGDATABASE: ducky_human_capital_db
      PGUSER: postgres
      PGPASSWORD: postgres
      REGISTRY_URL: http://registry-microservice:3009
    depends_on:
      - db-human-capital
      - seed-human-capital
      - registry-microservice
    ports: ["3005:3005"]

  human-capital-bff-service:
    build: ./human-capital-bff-service
    environment:
      PORT: 4002
      HC_BASE_URL: http://human-capital-microservice:3005
    depends_on: [human-capital-microservice]
    ports: ["4002:4002"]

  human-capital-frontend:
    build: ./human-capital-frontend
    environment:
      PORT: 3006
    depends_on: [human-capital-bff-service]
    ports: ["3006:3006"]
    hostname: hcapital.ducky.local

  db-treasury:
    image: postgres:16
    environment:
      POSTGRES_DB: ducky_treasury_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5437:5432"

  seed-treasury:
