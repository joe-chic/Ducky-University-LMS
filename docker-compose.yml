services:
  db-users:
    image: postgres:16
    environment:
      POSTGRES_DB: user_accounts_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"

  schema-users:
    image: postgres:16
    restart: "no"
    command: ["true"]

  users-microservice:
    build:
      context: ./users-microservice
    environment:
      PORT: 3001
      PGHOST: db-users
      PGPORT: 5432
      PGDATABASE: user_accounts_db
      PGUSER: postgres
      PGPASSWORD: postgres
      JWT_SECRET: ducky-dev-secret
    depends_on:
      - db-users
      - seed-users
    ports:
      - "3001:3001"

  seed-users:
    image: postgres:16
    depends_on:
      - db-users
    environment:
      PGHOST: db-users
      PGPORT: 5432
      PGDATABASE: user_accounts_db
      PGUSER: postgres
      PGPASSWORD: postgres
    volumes:
      - ./db/user_accounts_db/user_accounts_db.sql:/seed/user_accounts_db.sql
      - ./db/user_accounts_db/user_accounts_db_dummy_data.sql:/seed/user_accounts_db_dummy_data.sql
    command: >
      sh -c "until psql -h $$PGHOST -p $$PGPORT -U $$PGUSER -d $$PGDATABASE -c 'select 1' >/dev/null 2>&1; do sleep 1; done;
      sed -e 's/NOT NULL, CHECK/NOT NULL CHECK/g' -e '/^CREATE DATABASE /d' -e '/^\\c /d' /seed/user_accounts_db.sql | psql -h $$PGHOST -p $$PGPORT -U $$PGUSER -d $$PGDATABASE;
      psql -v ON_ERROR_STOP=0 -h $$PGHOST -p $$PGPORT -U $$PGUSER -d $$PGDATABASE -f /seed/user_accounts_db_dummy_data.sql;
      psql -h $$PGHOST -p $$PGPORT -U $$PGUSER -d $$PGDATABASE -v ON_ERROR_STOP=1 -c \"INSERT INTO users(
        user_id, campus_id, first_name, middle_name, father_lastname, mother_lastname,
        user_email, user_phone, role_id, user_password, user_state,
        last_login, created_by, latest_modified_by
      ) VALUES
        (1, 1001, 'Ada', 'L.', 'Lovelace', 'Byron', 'ada.lovelace@ducky.edu', '+5215555550101', 1, 'admin', 'active', '2024-03-01T10:00:00Z', 1, 1),
        (2, 1002, 'Grace', NULL, 'Hopper', 'Murray', 'grace.hopper@ducky.edu', '+5215555550102', 2, 'grace', 'active', '2024-03-01T11:00:00Z', 1, 1),
        (3, 1003, 'Alan', NULL, 'Turing', 'Bolton', 'alan.turing@ducky.edu', '+5215555550103', 3, 'alan', 'active', '2024-03-01T12:00:00Z', 1, 1),
        (4, 2001, 'Maria', NULL, 'Gonzalez', 'Lopez', 'student2001@ducky.edu', '+5215555550201', 4, 'maria', 'active', '2024-03-02T10:00:00Z', 1, 1),
        (5, 2002, 'Luis', NULL, 'Perez', 'Garcia', 'student2002@ducky.edu', '+5215555550202', 4, 'luis', 'active', '2024-03-02T11:00:00Z', 1, 1),
        (6, 2003, 'Sofia', 'A.', 'Ramirez', 'Santos', 'student2003@ducky.edu', '+5215555550203', 4, 'sofia', 'active', '2024-03-02T12:00:00Z', 1, 1)
      ON CONFLICT (user_id) DO UPDATE SET user_password = EXCLUDED.user_password, role_id = EXCLUDED.role_id;\""

  db-library:
    image: postgres:16
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - ./db/ducky_library_db/ducky_library_db.sql:/docker-entrypoint-initdb.d/01_ducky_library_db.sql
    ports:
      - "5434:5432"

  library-microservice:
    build:
      context: ./library-microservice
    environment:
      PORT: 3002
      PGHOST: db-library
      PGPORT: 5432
      PGDATABASE: ducky_library_db
      PGUSER: postgres
      PGPASSWORD: postgres
    depends_on:
      - db-library
      - seed-library
    ports:
      - "3002:3002"

  seed-library:
    image: postgres:16
    depends_on:
      - db-library
    environment:
      PGHOST: db-library
      PGPORT: 5432
      PGDATABASE: ducky_library_db
      PGUSER: postgres
      PGPASSWORD: postgres
    volumes:
      - ./db/ducky_library_db/ducky_library_db_dummy_data.sql:/seed/ducky_library_db_dummy_data.sql
    command: >
      sh -c "until psql -h $$PGHOST -p $$PGPORT -U $$PGUSER -d $$PGDATABASE -c 'select 1' >/dev/null 2>&1; do sleep 1; done;
      sed -e '/^\\c /d' /seed/ducky_library_db_dummy_data.sql | psql -v ON_ERROR_STOP=0 -h $$PGHOST -p $$PGPORT -U $$PGUSER -d $$PGDATABASE"

  bff-service:
    build:
      context: ./BFF-service
    environment:
      PORT: 4000
      JWT_SECRET: ducky-dev-secret
      USERS_BASE_URL: http://users-microservice:3001
      LIBRARY_BASE_URL: http://library-microservice:3002
      TREASURY_BASE_URL: http://treasury-microservice:3007
      CHATBOT_BASE_URL: http://chatbot-microservice:4005
    depends_on:
      - users-microservice
      - library-microservice
      - chatbot-microservice
    ports:
      - "4000:4000"
    hostname: bff.ducky.local

  frontend-service:
    build:
      context: ./frontend-service
    environment:
      HOST: 0.0.0.0
      CHOKIDAR_USEPOLLING: "true"
    depends_on:
      - bff-service
    ports:
      - "3000:3000"
    hostname: lms.ducky.local

  db-scholar:
    image: postgres:16
    environment:
      POSTGRES_DB: ducky_scholar_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5435:5432"

  seed-scholar:
    image: postgres:16
    restart: "no"
    depends_on:
      - db-scholar
    environment:
      PGHOST: db-scholar
      PGPORT: 5432
      PGDATABASE: ducky_scholar_db
      PGUSER: postgres
      PGPASSWORD: postgres
    volumes:
      - ./db/ducky_scholar_db/ducky_scholar_db.sql:/seed/schema.sql
      - ./db/ducky_scholar_db/ducky_scholar_db_dummy_data.sql:/seed/data.sql
    command: >
      sh -c "until psql -h $$PGHOST -p $$PGPORT -U $$PGUSER -d $$PGDATABASE -c 'select 1' >/dev/null 2>&1; do sleep 1; done;
      sed -e '/^CREATE DATABASE /d' -e '/^\\\\c /d' /seed/schema.sql | psql -h $$PGHOST -p $$PGPORT -U $$PGUSER -d $$PGDATABASE;
      sed -e '/^\\\\c /d' /seed/data.sql | psql -v ON_ERROR_STOP=0 -h $$PGHOST -p $$PGPORT -U $$PGUSER -d $$PGDATABASE"

  scholar-microservice:
    build: ./scholar-microservice
    environment:
      PORT: 3003
      PGHOST: db-scholar
      PGPORT: 5432
      PGDATABASE: ducky_scholar_db
      PGUSER: postgres
      PGPASSWORD: postgres
      REGISTRY_URL: http://registry-microservice:3009
    depends_on:
      - db-scholar
      - seed-scholar
      - registry-microservice
    ports: ["3003:3003"]

  scholar-bff-service:
    build: ./scholar-bff-service
    environment:
      PORT: 4001
      SCHOLAR_BASE_URL: http://scholar-microservice:3003
    depends_on: [scholar-microservice]
    ports: ["4001:4001"]

  scholar-frontend:
    build: ./scholar-frontend
    environment:
      PORT: 3004
    depends_on: [scholar-bff-service]
    ports: ["3004:3004"]
    hostname: scholar.ducky.local

  # ─── REGISTRY ───────────────────────────────────────────────────────────────────
  db-registry:
    image: postgres:16
    environment:
      POSTGRES_DB: service_registry_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5438:5432"

  seed-registry:
    image: postgres:16
    restart: "no"
    depends_on:
      - db-registry
    environment:
      PGHOST: db-registry
      PGPORT: 5432
      PGDATABASE: service_registry_db
      PGUSER: postgres
      PGPASSWORD: postgres
    volumes:
      - ./db/service_registry_db/service_registry_db.sql:/seed/schema.sql
      - ./db/service_registry_db/service_registry_db_dummy_data.sql:/seed/data.sql
    command: >
      sh -c "until psql -h $$PGHOST -p $$PGPORT -U $$PGUSER -d $$PGDATABASE -c 'select 1' >/dev/null 2>&1; do sleep 1; done;
      sed -e '/^CREATE DATABASE /d' -e '/^\\\\c /d' /seed/schema.sql | psql -h $$PGHOST -p $$PGPORT -U $$PGUSER -d $$PGDATABASE;
      sed -e '/^\\\\c /d' /seed/data.sql | psql -v ON_ERROR_STOP=0 -h $$PGHOST -p $$PGPORT -U $$PGUSER -d $$PGDATABASE"

  registry-microservice:
    build: ./registry-microservice
    environment:
      PORT: 3009
      PGHOST: db-registry
      PGPORT: 5432
      PGDATABASE: service_registry_db
      PGUSER: postgres
      PGPASSWORD: postgres
    depends_on:
      - db-registry
      - seed-registry
    ports: ["3009:3009"]

  db-human-capital:
    image: postgres:16
    environment:
      POSTGRES_DB: ducky_human_capital_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5436:5432"

  seed-human-capital:
    image: postgres:16
    restart: "no"
    depends_on:
      - db-human-capital
    environment:
      PGHOST: db-human-capital
      PGPORT: 5432
      PGDATABASE: ducky_human_capital_db
      PGUSER: postgres
      PGPASSWORD: postgres
